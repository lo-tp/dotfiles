name: Single Origin FE
root: ~/Desktop/Single-Origin/code/
pre_window: 
  - export SESSION_HOME="~/.config/nvim/session/single-origin"
  - export MFA_STS_DURATION=129600
  - export KUBECONFIG=~/.kube/config-aws
  - nvm use lts/jod

windows:
  - FE Editor:
    - cd singleorigin-web
    - export VIM_SESSION=$SESSION_HOME/web.vim
    - vim -S $VIM_SESSION
  - FE CMD:
      layout: main-vertical
      panes:
        - cmd:
          - cd singleorigin-web
          - git status
        - kubernetes:
          - cd singleorigin-web
          - echo 'kubectl port-forward -n staging svc/kona-staging-core 21002:8080 21003:9090'
        - server:
          - cd singleorigin-web
  - New FE Editor:
    - cd fe-revamp
    - export VIM_SESSION=$SESSION_HOME/web-revamp.vim
    - vim -S $VIM_SESSION

  - New FE CMD:
      layout: main-vertical
      panes:
        - cmd:
          - cd fe-revamp
          - git status
        - server:
          - cd fe-revamp
