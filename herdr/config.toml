onboarding = false

[keys]
# set -g prefix C-n
prefix = "ctrl+n"

# bind r source-file ... Reloaded!
reload_config = "prefix+r"

# bind c new-window  (already the Herdr default)
new_tab = "prefix+c"

# Detach = leave the session running in the background server; `herdr` re-attaches.
# Default is prefix+q, which is too easy to hit by accident. Moved to prefix+d
# (prefix+shift+d is still close_workspace, so this doesn't collide).
detach = "prefix+d"

# Splits — `|` for horizontal (left/right) and `-` for vertical (top/bottom),
# matching the tmux habit. The literal "|" and "-" characters are both accepted
# by Herdr (only the named "pipe" form is rejected).
split_horizontal = "prefix+-"       # left/right (tmux `|`)
split_vertical   = "prefix+|"       # top/bottom (tmux `-`)

# FOCUS — tmux used j/k/h/l for resize-pane; in Herdr these focus the
# neighbor pane (usually what you actually want). Defaults:
# focus_pane_down/up/left/right = prefix+j/k/h/l
# If you want tmux-style resize-by-1, add:
resize_pane_down   = "prefix+alt+j"
resize_pane_up     = "prefix+alt+k"
resize_pane_left   = "prefix+alt+h"
resize_pane_right  = "prefix+alt+l"

# tmux `prefix [` -> copy mode. Herdr ships this unbound, so bind it here.
# (tmux `prefix J` was your edit-scrollback habit; Herdr's default is prefix+e.)
copy_mode       = "prefix+J"
edit_scrollback = "prefix+e"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-hints.open"

[ui]
# your existing settings
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

# set -g mouse on
mouse_capture = true
# replaces tmux-yank + your xclip / paste bindings (native clipboard)
copy_on_select = true

# Sidebar space rows. Default is [["state_icon", "workspace"], ["branch", "git_status"]];
# the second row is the "main ↑1" git line, so dropping it hides branch + ahead/behind.
# To keep the branch name but hide only the ↑1 marker, use [["state_icon","workspace"],["branch"]].
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[terminal]
# set -g default-shell "$SHELL"  (empty => $SHELL)
default_shell = ""

[theme]
# pick a base theme closest to your tmux palette, then override tokens
name = "kanagawa-lotus"
# [theme.custom]
# accent = "#89b4fa"

# Status entries — replaces your tmux status-right (date/battery/CPU/git).
# Verify the exact inline-table syntax with `herdr --skill` before relying on it.
# tab_bar_right = [
#   { type = "datetime" },
#   { type = "command", command = "..." },  # battery
#   { type = "command", command = "..." },  # cpu
#   { type = "command", command = "..." },  # git
# ]
auto_switch = false
